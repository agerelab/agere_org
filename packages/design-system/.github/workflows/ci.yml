name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens
      - name: Generated tokens are committed
        run: git diff --exit-code -- src/styles/tokens.*.css src/tokens/generated
      - name: No raw palette / hex in components
        run: "! grep -rnE '(bg|text|border)-(gray|slate|zinc|neutral|red|green|blue|amber)-[0-9]{2,3}' src/components"
      - name: AGENTS.md interface rules (G01–G12)
        run: npm run lint:guidelines
      - name: No // comments rendered as JSX text
        run: npm run check:jsx-comments
      - name: AGENTS.md and GUIDELINES.md are generated from the rules
        run: node scripts/build-agents-md.mjs --check
      - run: npm run typecheck
      - run: npm test -- --coverage
      - name: Browser verification (Chromium · axe with contrast on · both themes)
        run: npx playwright install --with-deps chromium && pip install playwright && npm run verify:browser
      - run: npm run build

  visual:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          onlyChanged: true
          exitZeroOnChanges: true   # changes go to review, not red builds

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, visual]
    permissions: { contents: write, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://npm.pkg.github.com" }
      - run: npm ci
      - uses: changesets/action@v1
        with:
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
